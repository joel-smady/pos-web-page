<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI & Tech News Scraper</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>AI & Tech News Scraper</h1>
      <p>Search aggregated RSS feeds for technology and AI news.</p>

      <div class="controls">
        <input id="q" type="search" placeholder="Search terms (e.g. ai, machine learning)" />
        <button id="search">Search</button>
      </div>

      <div id="sources"></div>

      <div id="results"></div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
